<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roselt Invoice Generator</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="assets/img/favicon.png" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Theme applies from IndexedDB once the app loads; use system preference until then -->
  <script>
    (function () {
      try {
        var t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <style>
    html:not([data-i18n-ready]) #app-root {
      visibility: hidden;
    }
  </style>

  <!-- App styles -->
  <link rel="stylesheet" href="index.css" />

  <!-- Charts.css (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/charts.css/dist/charts.min.css" />

  <!-- PDF export -->
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js" defer></script>
</head>

<body>
  <div id="app-root">
    <app-header></app-header>
    <div class="app-body">
      <app-sidebar></app-sidebar>
      <main id="app" class="app-main" aria-live="polite"></main>
    </div>
  </div>

  <im-toast></im-toast>
  <app-dialog></app-dialog>

  <!-- Core libraries (order matters; plain global scripts, no modules) -->
  <script src="assets/js/util.js"></script>
  <script src="assets/js/list-selection.js"></script>
  <script src="assets/js/idb.js"></script>
  <script src="assets/js/logo-store.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/doc.js"></script>
  <script src="assets/js/templates.js"></script>
  <script src="assets/js/pdf.js"></script>
  <script src="assets/js/routing.js"></script>

  <!-- Web components -->
  <script src="components/toast.js"></script>
  <script src="components/app-dialog.js"></script>
  <script src="components/app-header.js"></script>
  <script src="components/app-sidebar.js"></script>
  <script src="components/contact-form.js"></script>
  <script src="components/template-card.js"></script>
  <script src="components/line-items-editor.js"></script>
  <script src="components/invoice-preview.js"></script>
  <script src="components/app-select.js"></script>

  <!-- Built-in invoice templates load from JSON via assets/js/templates.js -->

  <!-- Bootstrap the app -->
  <script src="index.js"></script>
</body>

</html>
