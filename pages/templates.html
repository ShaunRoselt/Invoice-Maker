<div class="page-header">
  <div>
    <h1 data-i18n="templates.title">Templates</h1>
    <p class="subtitle" data-i18n="templates.subtitle">Full A4 previews, scaled to each card. Use to start an invoice, or Edit layout to change the design.</p>
  </div>
  <div class="page-actions">
    <input class="input" id="tpl-search" type="search" data-i18n-placeholder="templates.searchPlaceholder" placeholder="Search templates…" style="width:240px" autocomplete="off">
    <div class="seg" id="tpl-filter">
      <button class="seg-btn active" data-filter="all" data-i18n="templates.filterAll">All</button>
      <button class="seg-btn" data-filter="builtin" data-i18n="templates.filterBuiltin">Built-in</button>
      <button class="seg-btn" data-filter="custom" data-i18n="templates.filterCustom">My templates</button>
    </div>
    <button class="btn btn-primary" data-act="create"><i class="bi bi-plus-lg"></i> <span data-i18n="templates.createTemplate">Create template</span></button>
  </div>
</div>

<div class="tpl-grid" id="tpl-grid"></div>
