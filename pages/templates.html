<div class="page-header">
  <div>
    <h1>Templates</h1>
    <p class="subtitle">Full A4 previews, scaled to each card. Use to start an invoice, or Edit layout to change the design.</p>
  </div>
  <div class="page-actions">
    <input class="input" id="tpl-search" type="search" placeholder="Search templates…" style="width:240px" autocomplete="off">
    <div class="seg" id="tpl-filter">
      <button class="seg-btn active" data-filter="all">All</button>
      <button class="seg-btn" data-filter="builtin">Built-in</button>
      <button class="seg-btn" data-filter="custom">My templates</button>
    </div>
    <button class="btn btn-primary" data-act="create"><i class="bi bi-plus-lg"></i> Create template</button>
  </div>
</div>

<div class="tpl-grid" id="tpl-grid"></div>
