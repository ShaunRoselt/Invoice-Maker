<div class="page-header">
  <div>
    <h1>Invoices</h1>
    <p class="subtitle">All invoices you've created. Hold Shift and click rows to select multiple.</p>
  </div>
  <div class="page-actions">
    <app-select id="inv-status-select" data-inline data-label="Status"></app-select>
    <select class="input select" id="inv-status">
      <option value="">All</option>
      <option value="draft">Draft</option>
      <option value="sent">Sent</option>
      <option value="paid">Paid</option>
      <option value="overdue">Overdue</option>
      <option value="outstanding">Outstanding</option>
    </select>
    <input class="input" id="inv-search" placeholder="Search invoices…" style="width:240px;margin-left:8px">
  </div>
</div>

<div class="card" id="inv-list-card">
  <div id="inv-list"></div>
</div>
