<div class="te2">
  <div class="te2-top">
    <div class="te2-name field" style="margin:0">
      <input class="input" id="te-name" placeholder="Template name">
    </div>
    <span class="te2-sub text-muted" id="te-sub" style="font-size:.82rem"></span>
    <div class="spacer"></div>
    <button class="btn btn-secondary btn-sm" data-act="reset" title="Reset selection"><i class="bi bi-aspect-ratio"></i>
      Page</button>
    <button class="btn btn-secondary btn-sm" data-act="json" title="View template JSON"><i class="bi bi-code-slash"></i>
      JSON</button>
    <button class="btn btn-primary" data-act="save"><i class="bi bi-check-lg"></i> Save template</button>
  </div>

  <div class="te2-shell">
    <aside class="te2-left" id="te-left">
      <div class="te2-search">
        <i class="bi bi-search"></i>
        <input type="text" id="te-search" placeholder="Search components…" autocomplete="off">
      </div>
      <div class="te2-components" id="te-components"></div>
    </aside>
    <div class="te2-splitter" id="te-splitter-left"></div>

    <main class="te2-center">
      <div class="te2-toolbar" id="te-toolbar"></div>
      <div class="te2-canvas" id="te-canvas"></div>
    </main>

    <div class="te2-splitter" id="te-splitter-right"></div>
    <aside class="te2-right" id="te-inspector"></aside>
  </div>
</div>
