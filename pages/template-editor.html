<div class="te2">
  <div class="te2-top">
    <div class="te2-name field" style="margin:0">
      <input class="input" id="te-name" placeholder="Template name">
    </div>
    <span class="te2-sub text-muted" id="te-sub" style="font-size:.82rem"></span>
    <div class="spacer"></div>
    <button class="btn btn-secondary btn-sm" data-act="reset" title="Reset selection"><i class="bi bi-aspect-ratio"></i>
      Page</button>
    <button class="btn btn-primary" data-act="save"><i class="bi bi-check-lg"></i> Save template</button>
  </div>

  <div class="te2-shell">
    <aside class="te2-left">
      <div class="te2-rail-title">Components</div>
      <div class="te2-palette" id="te-palette"></div>
      <div class="te2-rail-title">Merge fields</div>
      <p class="insp-hint" style="margin:0 4px 8px">Drag a field onto the page to insert live data.</p>
      <div class="te2-fields" id="te-fields"></div>
    </aside>

    <main class="te2-center">
      <div class="te2-toolbar" id="te-toolbar"></div>
      <div class="te2-canvas" id="te-canvas"></div>
    </main>

    <aside class="te2-right" id="te-inspector"></aside>
  </div>
</div>
