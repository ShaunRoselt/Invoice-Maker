<div class="page-header">
  <div>
    <h1>Settings</h1>
    <p class="subtitle">Defaults used to prefill new invoices.</p>
  </div>
  <div class="page-actions">
    <button class="btn btn-primary" data-act="save"><i class="bi bi-check-lg"></i> Save settings</button>
  </div>
</div>
</div>

<div class="settings-grid">
  <div>
    <div class="card card-pad">
      <h3 class="section-title">Appearance</h3>
      <div class="field"><label>Theme</label>
        <select class="select" id="s-theme">
          <option value="system">System</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
      <div class="field"><label>Language</label>
        <select class="select" data-path="language" data-search-placeholder="Search languages" id="s-language">
          <option value="en">English</option>
        </select>
      </div>
    </div>
  </div>
  <div>
    <div class="card card-pad">
      <h3 class="section-title">Invoice defaults</h3>
      <div class="field-row">
        <div class="field"><label>Currency</label>
          <select class="select" data-path="defaults.currency" data-search-placeholder="Search currencies">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="JPY">JPY</option>
            <option value="CNY">CNY</option>
            <option value="AUD">AUD</option>
            <option value="CAD">CAD</option>
            <option value="NZD">NZD</option>
            <option value="SGD">SGD</option>
            <option value="HKD">HKD</option>
            <option value="SEK">SEK</option>
            <option value="NOK">NOK</option>
            <option value="DKK">DKK</option>
            <option value="CHF">CHF</option>
            <option value="INR">INR</option>
            <option value="ZAR">ZAR</option>
            <option value="BRL">BRL</option>
            <option value="MXN">MXN</option>
            <option value="ARS">ARS</option>
            <option value="CLP">CLP</option>
            <option value="COP">COP</option>
            <option value="PEN">PEN</option>
            <option value="TRY">TRY</option>
            <option value="RUB">RUB</option>
            <option value="KRW">KRW</option>
            <option value="PLN">PLN</option>
            <option value="ILS">ILS</option>
            <option value="AED">AED</option>
            <option value="MYR">MYR</option>
            <option value="IDR">IDR</option>
            <option value="PHP">PHP</option>
            <option value="THB">THB</option>
            <option value="VND">VND</option>
          </select>
        </div>
        <div class="field"><label>Default tax rate (%)</label><input class="input" type="number" min="0" step="any"
            data-path="defaults.taxRate"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Payment terms</label><input class="input" data-path="defaults.paymentTerms"></div>
        <div class="field"><label>Invoice number prefix</label><input class="input" data-path="defaults.numberPrefix">
        </div>
      </div>
      <div class="field"><label>Default notes</label><textarea class="textarea" data-path="defaults.notes"></textarea>
      </div>
      <div class="field"><label>Default payment instructions</label><textarea class="textarea"
          data-path="defaults.paymentInstructions"></textarea></div>
      <p class="text-muted" style="font-size:.82rem">Next invoice number: <strong id="s-next-number"></strong></p>
    </div>
  </div>
