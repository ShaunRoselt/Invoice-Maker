<div class="page-header">
  <div>
    <h1>Settings</h1>
    <p class="subtitle">Defaults used to prefill new invoices.</p>
  </div>
  <div class="page-actions">
    <button class="btn btn-primary" data-act="save"><i class="bi bi-check-lg"></i> Save settings</button>
  </div>
</div>
</div>

<div class="settings-grid">
  <div>
    <div class="card card-pad">
      <h3 class="section-title">Appearance</h3>
      <div class="field"><label>Theme</label>
        <select class="select" id="s-theme">
          <option value="system">System</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
      <div class="field"><label>Language</label>
        <select class="select" data-path="language" data-search-placeholder="Search languages" id="s-language">
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div class="card card-pad" style="margin-top:22px">
      <h3 class="section-title">Beta</h3>
      <div class="field">
        <div class="flex-between gap-12" style="margin-bottom:6px;align-items:center">
          <label for="s-beta" style="margin:0">Enable Beta features</label>
          <label class="switch">
            <input id="s-beta" type="checkbox" data-path="betaMode">
            <span class="switch-slider" aria-hidden="true"></span>
          </label>
        </div>
        <p class="text-muted" style="font-size:.82rem;margin:0">Enable to unlock template creation and editing. When
          disabled, you can only choose from built-in templates.</p>
      </div>
    </div>
  </div>
  <div>
    <div class="card card-pad">
      <h3 class="section-title">Invoice defaults</h3>
      <div class="field-row">
        <div class="field"><label>Currency</label>
          <select class="select" data-path="defaults.currency" data-search-placeholder="Search currencies">
            <option value="USD">USD — $</option>
            <option value="EUR">EUR — €</option>
            <option value="GBP">GBP — £</option>
            <option value="JPY">JPY — ¥</option>
            <option value="CNY">CNY — ¥</option>
            <option value="AUD">AUD — A$</option>
            <option value="CAD">CAD — C$</option>
            <option value="NZD">NZD — NZ$</option>
            <option value="SGD">SGD — S$</option>
            <option value="HKD">HKD — HK$</option>
            <option value="SEK">SEK — kr</option>
            <option value="NOK">NOK — kr</option>
            <option value="DKK">DKK — kr</option>
            <option value="CHF">CHF — CHF</option>
            <option value="INR">INR — ₹</option>
            <option value="ZAR">ZAR — R</option>
            <option value="BRL">BRL — R$</option>
            <option value="MXN">MXN — MX$</option>
            <option value="ARS">ARS — AR$</option>
            <option value="CLP">CLP — CLP$</option>
            <option value="COP">COP — COP$</option>
            <option value="PEN">PEN — S/</option>
            <option value="TRY">TRY — ₺</option>
            <option value="RUB">RUB — ₽</option>
            <option value="KRW">KRW — ₩</option>
            <option value="PLN">PLN — zł</option>
            <option value="ILS">ILS — ₪</option>
            <option value="AED">AED — AED</option>
            <option value="MYR">MYR — RM</option>
            <option value="IDR">IDR — Rp</option>
            <option value="PHP">PHP — ₱</option>
            <option value="THB">THB — ฿</option>
            <option value="VND">VND — ₫</option>
          </select>
        </div>
        <div class="field"><label>Default tax rate (%)</label><input class="input" type="number" min="0" step="any"
            data-path="defaults.taxRate"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Payment terms</label><input class="input" data-path="defaults.paymentTerms"></div>
        <div class="field"><label>Invoice number prefix</label><input class="input" data-path="defaults.numberPrefix">
        </div>
      </div>
      <div class="field"><label>Default notes</label><textarea class="textarea" data-path="defaults.notes"></textarea>
      </div>
      <div class="field"><label>Default payment instructions</label><textarea class="textarea"
          data-path="defaults.paymentInstructions"></textarea></div>
      <p class="text-muted" style="font-size:.82rem">Next invoice number: <strong id="s-next-number"></strong></p>
    </div>
  </div>
